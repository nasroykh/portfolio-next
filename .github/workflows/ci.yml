name: CI

on:
  push:
    branches: [main, portfolio_v2]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm test

      - run: pnpm build

      # GitHub's Ubuntu runners ship Google Chrome, which the Playwright config uses (channel: "chrome").
      # The chat test mocks /api, so no OpenRouter or Qdrant secrets are needed.
      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
